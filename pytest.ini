[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q
filterwarnings =
    # datetime.utcnow() is deprecated on 3.12 but its naive-timestamp format is
    # stored in the DB — replacing it is part of the future DB migration, not a
    # drive-by fix (aware/naive comparisons would break silently).
    ignore::DeprecationWarning:libs\.session\.combat_coordinator
    ignore::DeprecationWarning:libs\.ai\.audit_mixin
    ignore::DeprecationWarning:libs\.ai\.session_auditor
    ignore::DeprecationWarning:libs\.ai\.npc_spawn_engine
