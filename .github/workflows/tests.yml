name: tests

# Юнит-тесты Chacalbot (tests/) — быстрый прогон без Telegram/API-ключей.
# Зависимости бота ставятся из requirements.txt (нужны для импортов libs.*),
# тестовый раннер — pytest + pytest-asyncio.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        env:
          # Тесты не должны требовать реальных ключей; переменные нужны,
          # чтобы config_legacy не ругался и код шёл по детерминированному пути.
          TELEGRAM_BOT_TOKEN: "test-token"
          OPENAI_API_KEY: "test-key"
        run: python -m pytest tests/ -v --tb=short

      - name: Test report on failure
        if: failure()
        run: python -m pytest tests/ -v --tb=long -p no:cacheprovider
